name: Build Android APK
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: |
          npm install -g next typescript
          npm install
          npm install -D typescript @types/node @types/react @types/next
          npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Build Next.js
        run: |
          # יצירת התיקייה out באופן ידני אם Next.js לא עושה זאת
          npx next build
        env:
          NEXT_PRIVATE_LOCAL_WEBPACK_STATS: true

      - name: Initialize Capacitor
        run: |
          # מחיקת קונפיגורציות ישנות כדי למנוע התנגשויות
          rm -f capacitor.config.ts capacitor.config.json || true
          npx cap init "MyBrowser" "com.my.app" --web-dir out

      - name: Sync Android
        run: |
          npx cap add android || true
          npx cap sync android

      - name: Build APK
        run: |
          cd android && ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: finished-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
