name: Build Android APK
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: |
          npm install --legacy-peer-deps
          npm install -g next typescript
          npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Build Next.js
        run: |
          # ביטול Turbopack כדי למנוע את שגיאת ה-Root
          npx next build --no-lint
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NODE_ENV: production

      - name: Initialize Capacitor
        run: |
          rm -f capacitor.config.ts capacitor.config.json || true
          # Next.js 15 מייצר את הקבצים בתיקיית .next או out
          # ננסה להשתמש בתיקייה out (וודא שיש לך output: 'export' ב-next.config.ts)
          npx cap init "MyBrowser" "com.my.app" --web-dir out --confirm

      - name: Sync Android
        run: |
          npx cap add android || true
          npx cap sync android

      - name: Build APK
        run: |
          cd android && ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: finished-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
