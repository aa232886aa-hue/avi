name: Build Android APK
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18 # גרסה יציבה ל-Next.js

      - name: Install Dependencies
        run: |
          npm install
          npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Build Next.js Project
        run: |
          # פקודה שיוצרת את תיקיית ה-out (ה-HTML)
          npx next build || npm run build
        env:
          NEXT_PRIVATE_LOCAL_WEBPACK_STATS: true

      - name: Initialize Capacitor
        run: |
          # יצירת הקונפיגורציה אם היא חסרה
          npx cap init "MyBrowser" "com.my.app" --web-dir out --confirm

      - name: Sync Android
        run: |
          npx cap add android || true
          npx cap sync android

      - name: Build APK
        run: |
          cd android && ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: finished-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
