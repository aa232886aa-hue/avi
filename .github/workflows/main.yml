name: Build Android APK
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Locate index.html and Prepare
        run: |
          mkdir -p www
          # חיפוש הקובץ index.html בכל המאגר והעתקת התיקייה שלו ל-www
          INDEX_PATH=$(find . -name "index.html" -not -path "./www/*" | head -n 1)
          if [ -z "$INDEX_PATH" ]; then
            echo "ERROR: index.html not found anywhere!"
            ls -R
            exit 1
          fi
          INDEX_DIR=$(dirname "$INDEX_PATH")
          echo "Found index.html in $INDEX_DIR, copying to www..."
          cp -r $INDEX_DIR/. www/

      - name: Install and Build
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "MyBrowser" "com.my.app" --web-dir www
          npx cap add android || true
          npx cap sync android

      - name: Build APK
        run: |
          cd android && ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: finished-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
